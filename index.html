<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Club Réussir Ensemble">
<meta name="description" content="Club Réussir Ensemble — Compétition QCM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Club Réussir Ensemble</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f4f8;font-family:'DM Sans',sans-serif;min-height:100vh;padding:16px;color:#1a1f2e}
h1,h2,h3{font-family:'Syne',sans-serif;font-weight:800;color:#1a1f2e}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto}

/* ── HEADER ── */
.app-header{background:#1a1f2e;border-radius:16px;padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#fff}
.app-header .avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.app-header .info{flex:1;min-width:150px}
.app-header .name{font-family:'Syne',sans-serif;font-size:16px;font-weight:800}
.app-header .sub{font-size:12px;color:#94a3b8;margin-top:1px}
.install-btn{background:#25d366;color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}

/* ── TABS ── */
.tabs{display:flex;gap:4px;margin-bottom:14px;background:#fff;border-radius:12px;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow-x:auto}
.tab{padding:9px 16px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;background:transparent;color:#64748b;white-space:nowrap;transition:all .15s}
.tab.active{background:#6366f1;color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}

/* ── CARD ── */
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ── FORM ── */
label.f-label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px;margin-top:10px}
input[type=text],input[type=number],input[type=tel],input[type=email],select,textarea{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
textarea{resize:vertical;min-height:44px}

/* ── BUTTONS ── */
.btn{padding:9px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:#6366f1;color:#fff}
.btn-primary:hover{background:#4f52e0}
.btn-green{background:#25d366;color:#fff}
.btn-ghost{background:#e0e7ff;color:#4338ca}
.btn-danger{background:#fee2e2;color:#ef4444}
.btn-dark{background:#1a1f2e;color:#fff}
.btn-sm{padding:6px 10px;font-size:11.5px;border-radius:8px}
.btn:active{opacity:.8}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ── LIST ROW ── */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:140px}
.row .main .t1{font-weight:700;font-size:13.5px;color:#1a1f2e}
.row .main .t2{font-size:11.5px;color:#64748b;margin-top:1px}
.chip{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap}
.chip-indigo{background:#eef2ff;color:#4338ca}
.chip-green{background:#dcfce7;color:#15803d}
.chip-red{background:#fee2e2;color:#dc2626}
.chip-gray{background:#f1f5f9;color:#64748b}
.empty{text-align:center;color:#94a3b8;font-size:13px;padding:26px 10px}

/* ── QUESTION BUILDER ── */
.q-block{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px;position:relative}
.q-block .q-num{font-size:11px;font-weight:800;color:#6366f1;margin-bottom:6px}
.q-opt-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.q-opt-row input[type=radio]{width:16px;height:16px;flex-shrink:0;accent-color:#6366f1}
.q-remove{position:absolute;top:8px;right:8px;background:#fee2e2;color:#ef4444;border:none;border-radius:6px;width:24px;height:24px;font-size:12px;cursor:pointer}

/* ── QUIZ TAKING ── */
.timer-bar{position:sticky;top:8px;z-index:20;background:#1a1f2e;color:#fff;border-radius:14px;padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.timer-bar .tval{font-family:'DM Mono',monospace;font-size:20px;font-weight:700;color:#25d366}
.timer-bar.low .tval{color:#ef4444}
.question-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.question-card .qtxt{font-weight:700;font-size:14px;margin-bottom:10px;line-height:1.4}
.question-card .opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;margin-bottom:7px;cursor:pointer;font-size:13px}
.question-card .opt:hover{background:#f8fafc}
.question-card .opt.checked{background:#eef2ff;border-color:#6366f1;font-weight:600}
.question-card .opt input{margin-top:2px;accent-color:#6366f1}

/* ── RESULT SCREEN ── */
.result-hero{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:18px;padding:30px 20px;text-align:center;color:#fff;margin-bottom:14px}
.result-score{font-family:'Syne',sans-serif;font-size:44px;font-weight:800;line-height:1}
.result-pct{font-size:14px;opacity:.9;margin-top:6px}

/* ── LEADERBOARD ── */
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px}
.lb-row:nth-child(odd){background:#f8fafc}
.lb-rank{width:26px;text-align:center;font-weight:800;font-size:13px;color:#64748b;flex-shrink:0}
.lb-name{flex:1;font-weight:700;font-size:13px;color:#1a1f2e}
.lb-sub{font-size:11px;color:#94a3b8}
.lb-score{font-family:'DM Mono',monospace;font-weight:700;font-size:13px;color:#6366f1}

/* ── MISC ── */
.spinner{width:26px;height:26px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1f2e;color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.center-box{max-width:400px;margin:60px auto;text-align:center}
.center-box .icon{font-size:44px;margin-bottom:10px}
.center-box p{color:#64748b;font-size:13.5px;margin-top:6px;line-height:1.5}
</style>
</head>
<body>

<div id="toast" class="toast"></div>
<div id="app" class="wrap">
  <div class="spinner"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection,
         addDoc, query, where, onSnapshot, deleteDoc, updateDoc
       } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ── Même projet Firebase que "Emploi du temps" (synchronisation des élèves) ── */
const firebaseConfig = {
  apiKey: "AIzaSyBYeYPOptN2wEak_Ctcr4a8t5qXpj4riLE",
  authDomain: "emploi-temps.firebaseapp.com",
  projectId: "emploi-temps",
  storageBucket: "emploi-temps.firebasestorage.app",
  messagingSenderId: "665985283894",
  appId: "1:665985283894:web:b0c4cb14824bb8fed9a597"
};
const fbApp = initializeApp(firebaseConfig);
const fbDB  = getFirestore(fbApp);

/* ── Code d'accès formateur — à modifier ── */
const ADMIN_CODE = "REUSSIR2026";

/* ── Collections ── */
const C_ELEVES   = 'qcmc_eleves';
const C_QUIZ     = 'qcmc_quiz';
const C_RESULT   = 'qcmc_resultats';
const C_ROSTER   = 'edtxRoster'; // roster synchronisé depuis "Emploi du temps"
const C_CONFIG   = 'qcmc_config'; // état global de la compétition (tour actif)

/* ── Tours de la compétition (progression séquentielle, un seul actif à la fois) ── */
const TOURS = [
  { key:'16e',   label:'16èmes de finale', niveau:'QCM Collège' },
  { key:'8e',    label:'8èmes de finale',  niveau:'QCM Collège' },
  { key:'4e',    label:'4èmes de finale',  niveau:'QCM Lycée Seconde' },
  { key:'demi',  label:'Demi-finale',      niveau:'QCM Lycée Première' },
  { key:'finale',label:'Finale',           niveau:'Terminale SM / SE + Culture Générale' }
];
function tourInfo(key){ return TOURS.find(t=>t.key===key) || null; }
function tourLabel(key){ const t=tourInfo(key); return t ? `${t.label} — ${t.niveau}` : '—'; }

let currentTourActif = '16e';
let unsubTourGlobal = null;
function watchTourActif(cb){
  if(unsubTourGlobal) unsubTourGlobal();
  unsubTourGlobal = onSnapshot(doc(fbDB, C_CONFIG, 'etat'), snap=>{
    currentTourActif = (snap.exists() && snap.data().tourActif) || '16e';
    if(cb) cb();
  });
}
function detectFiliere(nomClasse){
  const n = (nomClasse||'').toUpperCase();
  if(/\bSM\b/.test(n)) return 'SM';
  if(/\bSE\b/.test(n)) return 'SE';
  return null;
}

/* ── Helpers ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tTO); window._tTO=setTimeout(()=>t.classList.remove('show'),2600); }
function genToken(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let t=''; for(let i=0;i<8;i++) t+=chars[Math.floor(Math.random()*chars.length)]; return t; }
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function shuffledIndices(n){ const a=[...Array(n).keys()]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function baseUrl(){ return `${window.location.origin}${window.location.pathname}`; }
function studentLink(token){ return `${baseUrl()}?code=${token}`; }
const LS_TOKEN_KEY = 'qcmc_student_token';
function saveStudentToken(token){ try{ localStorage.setItem(LS_TOKEN_KEY, token); }catch(e){} }
function getSavedStudentToken(){ try{ return localStorage.getItem(LS_TOKEN_KEY); }catch(e){ return null; } }
function clearSavedStudentToken(){ try{ localStorage.removeItem(LS_TOKEN_KEY); }catch(e){} }

/* ── PWA install prompt ── */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; });
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
window.doInstall = async function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if(choice && choice.outcome === 'accepted'){ dismissInstallBanner(true); }
    return;
  }
  showInstallInstructions(isIOS() ? 'ios' : 'android');
};
window.showInstallInstructions = function(platform){
  const old = document.getElementById('installInstructOverlay');
  if(old) old.remove();
  const steps = platform === 'ios'
    ? ["Appuie sur le bouton Partager <b>⬆️</b> en bas de Safari","Fais défiler et choisis <b>« Sur l'écran d'accueil »</b>","Appuie sur <b>Ajouter</b> en haut à droite"]
    : ["Appuie sur le menu <b>⋮</b> en haut à droite de ton navigateur","Choisis <b>« Ajouter à l'écran d'accueil »</b> ou <b>« Installer l'application »</b>","Confirme l'installation"];
  const overlay = document.createElement('div');
  overlay.id = 'installInstructOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%">
      <div style="font-weight:800;font-size:16px;margin-bottom:10px">📲 Installer l'application</div>
      <ol style="padding-left:18px;margin:0 0 14px 0;font-size:14px;line-height:1.8;color:#334155">
        ${steps.map(s=>`<li>${s}</li>`).join('')}
      </ol>
      <button class="btn btn-primary" style="width:100%" onclick="document.getElementById('installInstructOverlay').remove()">Compris</button>
    </div>`;
  document.body.appendChild(overlay);
};
window.dismissInstallBanner = function(installed){
  try{ sessionStorage.setItem('installBannerDismissed','1'); }catch(e){}
  const b = document.getElementById('installBanner');
  if(b) b.remove();
  if(installed) toast('✅ Application installée !');
};

if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }

const app = document.getElementById('app');
const params = new URLSearchParams(window.location.search);
const studentCode = params.get('code');
const isAdmin = params.get('admin') === '1';


/* ══════════════════════════════ ADMIN ══════════════════════════════ */
function bootAdmin(){
  if (sessionStorage.getItem('qcmcAdminOK') !== '1') {
    const pass = prompt('🔑 Code formateur :');
    if (pass !== ADMIN_CODE) { app.innerHTML = `<div class="center-box"><div class="icon">⛔</div><h2>Accès refusé</h2><p>Code incorrect.</p><div class="btn-row" style="justify-content:center;margin-top:16px"><button class="btn btn-primary btn-sm" onclick="location.reload()">Réessayer</button></div></div>`; return; }
    sessionStorage.setItem('qcmcAdminOK','1');
  }
  renderAdminShell();
  watchTourActif(()=>{
    const badge = document.getElementById('tourBadgeAdmin');
    if(badge) badge.textContent = tourLabel(currentTourActif);
    const sel = document.getElementById('tourActifSelect');
    if(sel) sel.value = currentTourActif;
  });
  watchRosterAutoSync();
  watchResultsLive();
}

let adminTab = 'eleves';
function renderAdminShell(){
  app.innerHTML = `
    <div class="app-header">
      <div class="avatar">🏆</div>
      <div class="info"><div class="name">Club Réussir Ensemble</div><div class="sub">Compétition QCM · Espace formateur · Tour : <span id="tourBadgeAdmin">${esc(tourLabel(currentTourActif))}</span></div></div>
    </div>
    <div class="tabs">
      <button class="tab" data-t="eleves">👥 Élèves</button>
      <button class="tab" data-t="quiz">📝 Quiz</button>
      <button class="tab" data-t="classement">🏅 Classement</button>
    </div>
    <div id="tabBody"></div>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ adminTab=b.dataset.t; paintAdminTabs(); renderAdminTab(); });
  paintAdminTabs();
  renderAdminTab();
}
function paintAdminTabs(){ app.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.t===adminTab)); }
function renderAdminTab(){
  if(adminTab==='eleves') renderAdminEleves();
  else if(adminTab==='quiz') renderAdminQuiz();
  else renderAdminClassement();
}

/* ── Élèves ── */
let unsubResultsGlobal = null;
function watchResultsLive(){
  if(unsubResultsGlobal) unsubResultsGlobal();
  unsubResultsGlobal = onSnapshot(collection(fbDB, C_RESULT), snap=>{
    window._resultsCache = snap.docs.map(d=>d.data());
    if(adminTab==='eleves'){
      renderElevesListDOM();
    } else if(adminTab==='classement'){
      renderLbGlobal();
      const sel = document.getElementById('lbQuizSelect');
      if(sel && sel.value) renderLbForQuiz(sel.value);
    }
  });
}
function computeEleveScore(token){
  const results = (window._resultsCache||[]).filter(r=>r.token===token);
  if(!results.length) return null;
  let totalScore=0, totalMax=0;
  results.forEach(r=>{ totalScore += (r.score||0); totalMax += (r.total||0); });
  return { pct: totalMax ? Math.round(totalScore/totalMax*100) : 0, nb: results.length, totalScore, totalMax };
}

let unsubEleves=null;
function renderAdminEleves(){
  const body = document.getElementById('tabBody');
  body.innerHTML = `
    <div class="card">
      <div class="card-title">🔄 Synchronisation automatique — Emploi du temps</div>
      <div style="font-size:12.5px;color:#64748b;margin-bottom:8px" id="rosterSyncStatus">Synchronisation en temps réel active. Tout élève ajouté dans "Emploi du temps" apparaît ici automatiquement, sans action de votre part.</div>
      <div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="forceRosterSync()">🔄 Resynchroniser maintenant</button></div>
    </div>
    <div class="card">
      <div class="card-title">➕ Ajouter un élève manuellement</div>
      <label class="f-label">Nom complet</label><input type="text" id="el-nom" placeholder="Nom et prénom">
      <label class="f-label">Classe</label><input type="text" id="el-classe" placeholder="Ex : 3ème A">
      <label class="f-label">Filière (Terminale uniquement — pour la Finale)</label>
      <select id="el-filiere"><option value="">—</option><option value="SM">SM</option><option value="SE">SE</option></select>
      <label class="f-label">Téléphone WhatsApp (optionnel)</label><input type="tel" id="el-tel" placeholder="Ex : 622000000">
      <label class="f-label">E-mail (optionnel)</label><input type="email" id="el-email" placeholder="email@exemple.com">
      <div class="btn-row"><button class="btn btn-primary" onclick="addEleveManuel()">Créer le lien personnel</button></div>
    </div>
    <div class="card">
      <div class="card-title">👥 Élèves inscrits</div>
      <div id="elevesList"><div class="spinner"></div></div>
    </div>`;
  if(unsubEleves) unsubEleves();
  unsubEleves = onSnapshot(collection(fbDB, C_ELEVES), snap=>{
    const list = snap.docs.map(d=>d.data()).sort((a,b)=> (a.classe||'').localeCompare(b.classe||'') || (a.nom||'').localeCompare(b.nom||''));
    window._elevesCache = list;
    renderElevesListDOM();
  });
}
function renderElevesListDOM(){
  const el = document.getElementById('elevesList');
  if(!el) return;
  const list = window._elevesCache || [];
  if(!list.length){ el.innerHTML = '<div class="empty">Aucun élève pour le moment.</div>'; return; }
  el.innerHTML = list.map(e=>{
    const sc = computeEleveScore(e.token);
    const scoreChip = sc
      ? `<span class="chip chip-green">🏆 ${sc.pct}% · ${sc.totalScore} pt${sc.totalScore>1?'s':''} (${sc.nb} quiz)</span>`
      : `<span class="chip chip-gray">Pas encore de quiz</span>`;
    return `
      <div class="row">
        <div class="main">
          <div class="t1">${esc(e.nom)} <span class="chip chip-indigo">${esc(e.classe||'—')}</span> ${e.filiere?`<span class="chip chip-indigo">${esc(e.filiere)}</span>`:''}</div>
          <div class="t2">Token : ${esc(e.token)}</div>
          <div style="margin-top:4px">${scoreChip}</div>
          <select class="btn-sm" style="margin-top:6px;max-width:160px" onchange="setEleveFiliere('${e.token}', this.value)">
            <option value="" ${!e.filiere?'selected':''}>Filière —</option>
            <option value="SM" ${e.filiere==='SM'?'selected':''}>SM</option>
            <option value="SE" ${e.filiere==='SE'?'selected':''}>SE</option>
          </select>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="copyEleveLink('${e.token}')">🔗 Copier</button>
        <button class="btn btn-green btn-sm" onclick="sendEleveWA('${e.token}','${esc(e.nom).replace(/'/g,"\\'")}','${e.tel||''}')">📲</button>
        <button class="btn btn-dark btn-sm" onclick="sendEleveMail('${e.token}','${esc(e.nom).replace(/'/g,"\\'")}','${e.email||''}')">✉️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteEleve('${e.token}','${esc(e.nom).replace(/'/g,"\\'")}')">🗑️</button>
      </div>`;
  }).join('');
}

let unsubRoster = null;
let rosterSyncBusy = false;
function watchRosterAutoSync(){
  if(unsubRoster) unsubRoster();
  unsubRoster = onSnapshot(collection(fbDB, C_ROSTER), snap=>{
    const classes = snap.docs.map(d=>({ id:d.id, ...d.data() })).filter(c=>c.eleves && c.eleves.length);
    window._rosterCache = classes;
    syncRosterToEleves(classes);
  });
}
async function syncRosterToEleves(classes){
  if(rosterSyncBusy) return; // évite les synchros concurrentes si plusieurs mises à jour arrivent d'un coup
  rosterSyncBusy = true;
  try{
    let existing;
    try{ existing = window._elevesCache || (await getDocs(collection(fbDB, C_ELEVES))).docs.map(d=>d.data()); }
    catch(e){ existing = []; }
    let created = 0;
    for(const grp of classes){
      for(const e of (grp.eleves||[])){
        const fullName = [e.name, e.prenom].filter(Boolean).join(' ').trim();
        if(!fullName) continue;
        const already = existing.some(x=> (x.nom||'').trim().toLowerCase()===fullName.toLowerCase() && (x.classe||'').trim().toLowerCase()===(grp.name||'').trim().toLowerCase());
        if(already) continue;
        const token = genToken();
        try{
          await setDoc(doc(fbDB, C_ELEVES, token), { token, nom: fullName, classe: grp.name||'', filiere: detectFiliere(grp.name), tel:null, email:null, createdAt: Date.now(), source:'roster-sync' });
          existing.push({ token, nom: fullName, classe: grp.name||'' }); // évite les doublons si plusieurs classes citent le même nom
          created++;
        }catch(err){}
      }
    }
    if(created){
      toast(`🔄 Synchro Emploi du temps : ${created} nouvel(aux) élève(s) ajouté(s) automatiquement.`);
      const status = document.getElementById('rosterSyncStatus');
      if(status) status.textContent = `Synchronisation en temps réel active. Dernière synchro : +${created} élève(s) à l'instant.`;
    }
  }finally{
    rosterSyncBusy = false;
  }
}

window.addEleveManuel = async function(){

window.sendEleveWA = function(token, nom, tel){

function nextTourKey(key){
  const idx = TOURS.findIndex(t=>t.key===key);
  if(idx<0 || idx===TOURS.length-1) return null;
  return TOURS[idx+1].key;
}

window.seedTerminaleQuiz = async function(){
  if(!confirm("Créer les 11 quiz du tour Finale (9 matières communes + Maths SM + SVT SE) ? Ils seront actifs immédiatement (visibles seulement quand le tour Finale sera activé, et seulement pour les élèves qualifiés).")) return;
  const existingTitres = new Set((window._quizCache||[]).map(q=>q.titre));
  let created=0, skipped=0;
  for(const s of TERMINALE_SEED){
    if(existingTitres.has(s.titre)){ skipped++; continue; }
    try{
      await addDoc(collection(fbDB, C_QUIZ), { titre:s.titre, matiere:s.matiere, classe:'', tour:'finale', filiere:s.filiere||'', dureeMin:s.dureeMin, questions:s.questions, actif:true, createdAt: Date.now() });
      created++;
    }catch(e){}
  }
  toast(`✅ ${created} quiz créé(s)${skipped?`, ${skipped} déjà existant(s)`:''}.`);
};

const TOUR_SEEDS = { '16e':COLLEGE_16E_SEED, '8e':COLLEGE_8E_SEED, '4e':SECONDE_4E_SEED, 'demi':PREMIERE_DEMI_SEED };
window.seedTourQuiz = async function(tourKey){
  const seed = TOUR_SEEDS[tourKey];
  const info = tourInfo(tourKey);
  if(!seed || !info) return;
  if(!confirm(`Créer les ${seed.length} quiz du tour "${info.label}" (${info.niveau}) ? Ils seront actifs immédiatement (visibles seulement quand ce tour sera activé).`)) return;
  const existingTitres = new Set((window._quizCache||[]).map(q=>q.titre));
  let created=0, skipped=0;
  for(const s of seed){
    if(existingTitres.has(s.titre)){ skipped++; continue; }
    try{
      await addDoc(collection(fbDB, C_QUIZ), { titre:s.titre, matiere:s.matiere, classe:'', tour:tourKey, filiere:'', dureeMin:s.dureeMin, questions:s.questions, actif:true, createdAt: Date.now() });
      created++;
    }catch(e){}
  }
  toast(`✅ ${created} quiz créé(s)${skipped?`, ${skipped} déjà existant(s)`:''}.`);
};

window.addQuestionBlock = function(prefill){

window.removeQuestionBlock = function(idx){ qBuilder.splice(idx,1); renderQuestionsBox(); };
function renderQuestionsBox(){
  const box = document.getElementById('qQuestionsBox');
  if(!box) return;
  box.innerHTML = qBuilder.map((qb,i)=>`
    <div class="q-block">
      <button class="q-remove" onclick="removeQuestionBlock(${i})">✕</button>
      <div class="q-num">QUESTION ${i+1}</div>
      <textarea placeholder="Énoncé de la question" data-role="qtext" data-i="${i}">${esc(qb.q)}</textarea>
      ${[0,1,2,3].map(oi=>`
        <div class="q-opt-row">
          <input type="radio" name="correct-${i}" ${qb.correct===oi?'checked':''} data-role="qcorrect" data-i="${i}" data-oi="${oi}">
          <input type="text" style="flex:1" placeholder="Réponse ${String.fromCharCode(65+oi)}" data-role="qopt" data-i="${i}" data-oi="${oi}" value="${esc(qb.options[oi])}">
        </div>`).join('')}
      <label class="f-label">Points</label>
      <input type="number" min="1" value="${qb.points}" style="max-width:100px" data-role="qpoints" data-i="${i}">
    </div>`).join('');
  box.querySelectorAll('[data-role]').forEach(elm=>{
    elm.addEventListener('input', e=>{
      const i = +e.target.dataset.i;
      if(e.target.dataset.role==='qtext') qBuilder[i].q = e.target.value;
      else if(e.target.dataset.role==='qopt') qBuilder[i].options[+e.target.dataset.oi] = e.target.value;
      else if(e.target.dataset.role==='qpoints') qBuilder[i].points = +e.target.value || 1;
    });
    elm.addEventListener('change', e=>{
      if(e.target.dataset.role==='qcorrect') qBuilder[+e.target.dataset.i].correct = +e.target.dataset.oi;

  });

window.calculerQualification = async function(){
  const tourSel = document.getElementById('qualTourSelect');
  const nombreEl = document.getElementById('qualNombre');
  if(!tourSel || !nombreEl) return;
  const tourKey = tourSel.value;
  const n = Math.max(1, +nombreEl.value || 0);
  const next = nextTourKey(tourKey);
  const infoTour = tourInfo(tourKey), infoNext = tourInfo(next);
  if(!next || !infoNext){ toast('⚠️ Aucun tour suivant pour ce tour.'); return; }
  if(!confirm(`Qualifier les ${n} meilleur(e)s du tour "${infoTour.label}" pour le tour "${infoNext.label}" ? Les qualifications déjà enregistrées pour "${infoNext.label}" seront remplacées.`)) return;

  const box = document.getElementById('qualResultBox');
  if(box) box.innerHTML = '<div class="spinner"></div>';

  try{
    const results = (window._resultsCache||[]).filter(r=>r.tour===tourKey);
    const byToken = {};
    results.forEach(r=>{
      if(!byToken[r.token]) byToken[r.token] = { nom:r.nom, classe:r.classe, totalScore:0, totalMax:0, nbQuiz:0 };
      byToken[r.token].totalScore += r.score;
      byToken[r.token].totalMax += r.total;
      byToken[r.token].nbQuiz += 1;
    });
    const ranked = Object.entries(byToken).map(([token,v])=>({
      token, ...v, pct: v.totalMax ? (v.totalScore/v.totalMax*100) : 0
    })).sort((a,b)=> b.pct - a.pct || b.totalScore - a.totalScore);

    const qualifiedTokens = new Set(ranked.slice(0, n).map(r=>r.token));
    const eleves = window._elevesCache || (await getDocs(collection(fbDB, C_ELEVES))).docs.map(d=>d.data());
    let count = 0;
    for(const e of eleves){
      const shouldQualify = qualifiedTokens.has(e.token);
      try{
        await updateDoc(doc(fbDB, C_ELEVES, e.token), { [`qualifications.${next}`]: shouldQualify });
        if(shouldQualify) count++;
      }catch(err){}
    }

    if(box){
      if(!ranked.length){
        box.innerHTML = '<div class="empty">Aucun résultat enregistré pour ce tour.</div>';
      } else {
        const medals=['🥇','🥈','🥉'];
        box.innerHTML = `<div class="t2" style="margin-bottom:8px">✅ ${count} élève(s) qualifié(s) pour « ${esc(infoNext.label)} ».</div>` +
          ranked.map((r,i)=>`
            <div class="lb-row">
              <div class="lb-rank">${medals[i]||(i+1)}</div>
              <div style="flex:1">
                <div class="lb-name">${esc(r.nom)} <span class="chip chip-indigo">${esc(r.classe||'')}</span> ${i<n?'<span class="chip chip-green">Qualifié</span>':''}</div>
                <div class="lb-sub">${r.nbQuiz} quiz du tour · ${r.totalScore}/${r.totalMax}</div>
              </div>
              <div class="lb-score">${Math.round(r.pct)}%</div>
            </div>`).join('');
      }
    }
    toast(`✅ ${count} élève(s) qualifié(s) pour ${infoNext.label}.`);
  }catch(e){
    toast('❌ Erreur : '+e.message);
    if(box) box.innerHTML = '<div class="empty">Erreur lors du calcul.</div>';
  }
};

function renderLbGlobal(){

function quizMatchesClasse(q){
  if(!q.classe || !q.classe.trim()) return true;
  return q.classe.trim().toLowerCase() === (student.classe||'').trim().toLowerCase();
}
function quizVisibleForStudent(q){
  // Un quiz sans tour assigné (ancien quiz) reste visible quel que soit le tour actif
  if(q.tour && q.tour !== currentTourActif) return false;
  if(!quizMatchesClasse(q)) return false;
  if(q.filiere && q.filiere.trim()){
    if((student.filiere||'').trim().toUpperCase() !== q.filiere.trim().toUpperCase()) return false;
  }
  // À partir du 2e tour, il faut être qualifié pour ce tour précis
  if(q.tour){
    const idx = TOURS.findIndex(t=>t.key===q.tour);
    if(idx>0){
      const quals = student.qualifications||{};
      if(!quals[q.tour]) return false;
    }
  }
  return true;
}

let activeQuiz=null, quizAnswers={}, quizStartTs=null, quizTimerInt=null;
window.startQuiz = async function(quizId){
  const snap = await getDoc(doc(fbDB, C_QUIZ, quizId));
  if(!snap.exists()){ toast('❌ Ce quiz n\'existe plus.'); return; }
  const already = await getDoc(doc(fbDB, C_RESULT, `${quizId}_${studentToken}`));
  if(already.exists()){ toast('✅ Vous avez déjà participé à ce quiz.'); return; }
  activeQuiz = { id: quizId, ...snap.data() };
  quizAnswers = {};
  quizStartTs = Date.now();
  renderQuizTaking();
};

function renderQuizTaking(){
  const body = document.getElementById('tabBody');
  const orderMap = activeQuiz.questions.map(q=>shuffledIndices(q.options.length));
  activeQuiz._orderMap = orderMap;
  body.innerHTML = `
    <div class="timer-bar" id="timerBar"><span>⏱️ Temps restant</span><span class="tval" id="timerVal">--:--</span></div>
    <div class="card"><div class="card-title">${esc(activeQuiz.titre)}</div></div>
    ${activeQuiz.questions.map((q,qi)=>`
      <div class="question-card">
        <div class="qtxt">${qi+1}. ${esc(q.q)}</div>
        ${orderMap[qi].map(oi=>`
          <label class="opt" data-qi="${qi}" data-oi="${oi}">
            <input type="radio" name="quiz-q-${qi}" value="${oi}">
            <span>${esc(q.options[oi])}</span>
          </label>`).join('')}
      </div>`).join('')}
    <div class="btn-row"><button class="btn btn-primary" style="width:100%;justify-content:center" onclick="submitQuiz(false)">✅ Valider mes réponses</button></div>`;

  body.querySelectorAll('.opt').forEach(lbl=>{
    lbl.addEventListener('click', ()=>{
      const qi = lbl.dataset.qi, oi = +lbl.dataset.oi;
      lbl.querySelector('input').checked = true;
      quizAnswers[qi] = oi;
      body.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(o=>o.classList.toggle('checked', o===lbl));
    });
  });

  const totalSec = activeQuiz.dureeMin*60;
  clearInterval(quizTimerInt);
  quizTimerInt = setInterval(()=>{
    const remain = totalSec - Math.floor((Date.now()-quizStartTs)/1000);
    const bar = document.getElementById('timerBar'), val = document.getElementById('timerVal');
    if(!bar) { clearInterval(quizTimerInt); return; }
    val.textContent = fmtTime(remain);
    bar.classList.toggle('low', remain<=30);
    if(remain<=0){ clearInterval(quizTimerInt); submitQuiz(true); }
  }, 1000);
}

window.submitQuiz = async function(auto){
  clearInterval(quizTimerInt);
  const total = activeQuiz.questions.reduce((s,q)=>s+(q.points||1),0);
  let score=0;
  activeQuiz.questions.forEach((q,qi)=>{ if(quizAnswers[qi]===q.correct) score += (q.points||1); });
  const dureeSec = activeQuiz.dureeMin*60;
  const tempsSec = Math.min(dureeSec, Math.round((Date.now()-quizStartTs)/1000));
  const pourcentage = Math.round(score/total*100);
  const data = { quizId: activeQuiz.id, quizTitre: activeQuiz.titre, tour: activeQuiz.tour||'', token: studentToken, nom: student.nom, classe: student.classe||'', filiere: student.filiere||'', score, total, pourcentage, tempsSec, dateSoumission: Date.now() };
  try{ await setDoc(doc(fbDB, C_RESULT, `${activeQuiz.id}_${studentToken}`), data); }
  catch(e){ toast('❌ Erreur d\'enregistrement : '+e.message); return; }
  const body = document.getElementById('tabBody');
  body.innerHTML = `
    <div class="result-hero">
      <div style="font-size:13px;opacity:.85">${auto?'⏰ Temps écoulé — ':''}Résultat</div>
      <div class="result-score">${score}/${total}</div>
      <div class="result-pct">${pourcentage}% · ⏱️ ${fmtTime(tempsSec)}</div>
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" onclick="studentTab='classement'; paintStudentTabs(); renderStudentTab()">🏅 Voir le classement</button>
      <button class="btn btn-ghost" onclick="studentTab='quiz'; paintStudentTabs(); renderStudentTab()">📝 Retour aux quiz</button>
    </div>`;
  activeQuiz=null;
};

async function renderStudentResults(){
  const body = document.getElementById('tabBody');
  body.innerHTML = `<div class="card"><div class="card-title">📊 Mes résultats</div><div id="stuResList"><div class="spinner"></div></div></div>`;
  const snap = await getDocs(query(collection(fbDB, C_RESULT), where('token','==',studentToken)));
  const list = snap.docs.map(d=>d.data()).sort((a,b)=>b.dateSoumission-a.dateSoumission);
  const el = document.getElementById('stuResList');
  if(!list.length){ el.innerHTML = '<div class="empty">Vous n\'avez pas encore participé à un quiz.</div>'; return; }
  el.innerHTML = list.map(r=>`
    <div class="row">
      <div class="main">
        <div class="t1">${esc(r.quizTitre)}</div>
        <div class="t2">${new Date(r.dateSoumission).toLocaleDateString('fr-FR')} · ⏱️ ${fmtTime(r.tempsSec)}</div>
      </div>
      <span class="chip chip-indigo">${r.score}/${r.total} (${r.pourcentage}%)</span>
    </div>`).join('');
}

async function renderStudentClassement(){
  const body = document.getElementById('tabBody');
  const quizSnap = await getDocs(collection(fbDB, C_QUIZ));
  const quizzes = quizSnap.docs.map(d=>({id:d.id,...d.data()})).filter(q=>quizMatchesClasse(q));
  body.innerHTML = `
    <div class="card">
      <div class="card-title">🏅 Classement</div>
      <select id="stuLbSelect"><option value="">🌍 Classement général</option>${quizzes.map(q=>`<option value="${q.id}">${esc(q.titre)}</option>`).join('')}</select>
      <div id="stuLbBox" style="margin-top:12px"><div class="spinner"></div></div>
    </div>`;
  const sel = document.getElementById('stuLbSelect');
  sel.onchange = ()=>loadStuLb(sel.value);
  loadStuLb('');
}
async function loadStuLb(quizId){
  const box = document.getElementById('stuLbBox');
  if(!box) return;
  box.innerHTML = '<div class="spinner"></div>';
  if(unsubStuLb) unsubStuLb();
  if(quizId){
    unsubStuLb = onSnapshot(query(collection(fbDB, C_RESULT), where('quizId','==',quizId)), snap=>{
      const results = snap.docs.map(d=>d.data()).sort((a,b)=>b.score-a.score || a.tempsSec-b.tempsSec);
      paintLb(box, results.map(r=>({nom:r.nom, classe:r.classe, score:`${r.score}/${r.total}`, sub:`⏱️ ${fmtTime(r.tempsSec)} · ${r.pourcentage}%`, isMe:r.token===studentToken})));
    });
  } else {
    unsubStuLb = onSnapshot(collection(fbDB, C_RESULT), snap=>{
      const byToken = {};
      snap.docs.forEach(d=>{
        const r=d.data();
        if(!byToken[r.token]) byToken[r.token]={ nom:r.nom, classe:r.classe, totalScore:0, totalMax:0, nbQuiz:0 };
        byToken[r.token].totalScore+=r.score; byToken[r.token].totalMax+=r.total; byToken[r.token].nbQuiz+=1;
      });
      const list = Object.entries(byToken).map(([tok,v])=>({...v, tok})).sort((a,b)=>(b.totalScore/b.totalMax)-(a.totalScore/a.totalMax));
      paintLb(box, list.map(r=>({nom:r.nom, classe:r.classe, score:`${Math.round(r.totalScore/r.totalMax*100)}%`, sub:`${r.nbQuiz} quiz passé(s)`, isMe:r.tok===studentToken})));
    });
  }
}
function paintLb(box, list){
  if(!list.length){ box.innerHTML = '<div class="empty">Aucun résultat pour le moment.</div>'; return; }
  const medals=['🥇','🥈','🥉'];
  box.innerHTML = list.map((r,i)=>`
    <div class="lb-row" style="${r.isMe?'outline:2px solid #6366f1;outline-offset:-2px':''}">
      <div class="lb-rank">${medals[i]||(i+1)}</div>
      <div style="flex:1">
        <div class="lb-name">${esc(r.nom)}${r.isMe?' <span class="chip chip-indigo">Vous</span>':''} <span class="chip chip-gray">${esc(r.classe||'')}</span></div>
        <div class="lb-sub">${r.sub}</div>
      </div>
      <div class="lb-score">${r.score}</div>
    </div>`).join('');
}

/* ══════════════════════════════ ROUTAGE (déclenché en dernier, une fois tout défini) ══════════════════════════════ */
if (studentCode) {
  saveStudentToken(studentCode);
  bootStudent(studentCode);
} else if (isAdmin) {
  bootAdmin();
} else {
  const savedToken = getSavedStudentToken();
  if (savedToken) {
    bootStudent(savedToken);
  } else {
    app.innerHTML = `
      <div class="center-box">
        <div class="icon">🏆</div>
        <h2>Club Réussir Ensemble</h2>
        <p>Ce lien est personnel. Demandez à votre formateur le lien qui vous a été envoyé pour accéder à votre espace.</p>
        <div class="btn-row" style="justify-content:center;margin-top:20px">
          <button class="btn btn-ghost btn-sm" onclick="location.href=location.pathname+'?admin=1'">🔑 Accès formateur</button>
        </div>
      </div>`;
  }
}
</script>
</body>
